<!doctype html>
<html lang="de-AT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d38"><title>Förderfinder – Demo</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17352f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.app{max-width:540px;margin:auto;min-height:100dvh;padding:22px 18px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:19px;font-weight:800}.tag{font-size:12px;background:#e0eee8;padding:7px 10px;border-radius:20px}.progress{height:7px;background:#dfe8e2;border-radius:20px;overflow:hidden;margin-bottom:25px}.bar{height:100%;background:#2d806b;transition:width .2s}.card{background:white;border:1px solid #e2e9e4;border-radius:25px;padding:26px 22px;box-shadow:0 10px 30px #143e2810}h1{font-size:29px;line-height:1.16;letter-spacing:-.7px;margin:12px 0}p{line-height:1.5;color:#597169}.eyebrow{font-size:13px;font-weight:700;color:#357966}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e0ad42;outline-offset:3px}.option{display:block;text-align:left;width:100%;background:#f7faf7;border:1.5px solid #dce8e0;padding:17px;border-radius:15px;margin-top:11px;font-weight:600;color:#1e4339}.option:hover,.option.selected{border-color:#26745d;background:#e7f4ec}.actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.secondary{border:1px solid #c9dbd1;background:white;color:#255c4c;border-radius:12px;padding:12px 15px}.primary{background:#206d58;color:white;border:0;border-radius:13px;padding:16px 22px;font-weight:700;width:100%;margin-top:18px}.primary:disabled{opacity:.4;cursor:not-allowed}.helper{margin-top:18px;border-top:1px solid #e6ede8;padding-top:18px}.helperbox{background:#f0f7f3;border-radius:14px;padding:15px;color:#31594c;margin-top:12px;line-height:1.5}.fine{font-size:12px;color:#71847c}.result{background:#f4f8f5;padding:15px;border-radius:14px;margin:12px 0}.result strong{display:block;margin-bottom:5px}.hidden{display:none}footer{text-align:center;margin-top:20px;font-size:12px;color:#6e8278}input{width:100%;padding:15px;border:1px solid #bbd0c4;border-radius:12px;font:inherit} 
</style></head><body><main class="app"><header class="top"><div class="brand">✳ Förderfinder</div><span class="tag">Öffentliche Beta · keine Anspruchszusage</span></header><div class="progress" aria-label="Fortschritt"><div id="bar" class="bar" style="width:0%"></div></div><section class="card" id="screen" aria-live="polite"></section><footer>Keine Anmeldung · Keine Übertragung deiner Antworten · Keine verbindliche Förderprüfung · Keine Dokumente hochladen</footer></main>
<script>
"use strict";
const questions=[
{title:"Wo wohnst du?",help:"Das Bundesland entscheidet mit, welche regionalen Familienförderungen wir später prüfen.",options:["Niederösterreich","Wien","Steiermark","Anderes Bundesland"]},
{title:"Wie viele Kinder hast du?",help:"Wir fragen nach Kindern, weil viele Leistungen von Anzahl und Alter abhängen.",options:["Keine","1 Kind","2 Kinder","3 oder mehr"]},
{title:"Wie alt sind deine Kinder?",help:"Das Alter beeinflusst beispielsweise Familienbeihilfe und Familienbonus. Für diese Demo reicht eine grobe Angabe.",options:["Alle unter 18","Mindestens eines über 18","Weiß ich nicht","Keine Kinder"]},
{title:"Wie ist deine Arbeitssituation?",help:"Damit können wir später steuerliche Förderungen und mögliche Unterstützungen passend auswählen.",options:["Angestellt","Selbstständig","In Karenz","Arbeitslos","Andere Situation"]},
{title:"Lebst du mit einer Partnerperson zusammen?",help:"Manche steuerlichen Absetzbeträge hängen auch von der Lebens- und Einkommenssituation deiner Partnerperson ab.",options:["Ja","Nein","Möchte ich nicht angeben"]},
{title:"Wurde der Familienbonus Plus schon beantragt?",help:"Der Familienbonus Plus ist eine Steuerentlastung, keine automatische Auszahlung. Ob und wie viel möglich ist, hängt unter anderem von Steuerjahr und Einkommensteuer ab.",options:["Ja","Nein","Weiß ich nicht"]}
];
let step=-1,answers=[],helpOpen=false,voice=false;
const API="https://dihnhlkdpblwtuyomvuh.supabase.co/rest/v1";
const PUBLIC_KEY="sb_publishable_TJCgL8iPQCNKUk3mT4jMEw_PBZ5UfhM";
let publishedBenefits=[];
async function loadCatalog(){try{const r=await fetch(API+"/benefit_versions?select=id,valid_from,valid_to,summary,benefits(title,category,jurisdiction),benefit_sources(official_url,source_title)&status=eq.published&order=valid_from.desc",{headers:{"apikey":PUBLIC_KEY}});if(!r.ok)throw Error("HTTP "+r.status);publishedBenefits=await r.json();}catch(e){publishedBenefits=[];console.warn("Förderkatalog derzeit nicht verfügbar",e)}}
loadCatalog();
const el=document.getElementById("screen"),bar=document.getElementById("bar");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function speak(t){if(!("speechSynthesis" in window)){alert("Vorlesen wird von diesem Browser nicht unterstützt.");return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-AT";u.rate=.9;speechSynthesis.speak(u)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Spracheingabe ist in diesem Browser nicht verfügbar. Bitte tippe auf eine Antwort.");return;}const r=new SR();r.lang="de-AT";r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();const i=questions[step].options.findIndex(x=>t.includes(x.toLowerCase())||x.toLowerCase().includes(t));if(i>=0)select(i);else alert("Nicht eindeutig erkannt. Bitte wähle eine Antwort aus.")};r.start()}
function select(i){answers[step]=i;render()}
function next(){if(step<questions.length-1){step++;helpOpen=false;render()}else{step=questions.length;render()}}
function back(){step=Math.max(-1,step-1);helpOpen=false;render()}
function render(){bar.style.width=(step<0?0:step>=questions.length?100:Math.round((step+1)/questions.length*100))+"%";
if(step===-1){el.innerHTML='<div class="eyebrow">Dein Geld. Deine Möglichkeiten.</div><h1>Welche Förderungen stehen dir zu?</h1><p>Finde mit wenigen einfachen Fragen heraus, welche Familienleistungen du genauer prüfen solltest.</p><div class="helperbox">🔒 Dieser erste Prototyp speichert nichts und verwendet noch keine echten Förderberechnungen.</div><button class="primary" id="start">Kostenlosen Check starten →</button><div class="actions"><button class="secondary" id="read">🔊 Vorlesen</button></div>';document.getElementById("start").onclick=next;document.getElementById("read").onclick=()=>speak("Welche Förderungen stehen dir zu? Finde es mit wenigen Fragen heraus.");return}
if(step===questions.length){const children=answers[1]!==0;const bonus=children&&answers[5]!==0;el.innerHTML='<div class="eyebrow">Dein erster Überblick</div><h1>Diese Leistungen solltest du prüfen</h1><p>Das sind <b>Hinweise</b>, keine geprüften Ansprüche oder zugesagten Geldbeträge.</p>'+ (children?'<div class="result"><strong>Familienbeihilfe</strong>Prüfen, ob du sie bereits erhältst und ob die Voraussetzungen erfüllt sind.</div><div class="result"><strong>Familienbonus Plus</strong>'+(bonus?'Prüfen, ob du ihn für relevante Steuerjahre beantragen kannst.':'Prüfen, ob er bereits korrekt berücksichtigt wurde.')+'</div><div class="result"><strong>Alleinverdiener- / Alleinerzieherabsetzbetrag</strong>Kann je nach Partnerschaft, Einkünften und Steuerjahr relevant sein.</div>':'<div class="result"><strong>Familienleistungen</strong>Du hast keine Kinder angegeben. Für diesen ersten Familien-Prototyp gibt es keine passende Vorauswahl.</div>')+(publishedBenefits.length?'<div class="helperbox"><strong>Amtlich geprüfte Katalogeinträge:</strong> '+publishedBenefits.map(x=>esc(x.benefits?.title||'Förderung')+' (gültig ab '+esc(x.valid_from)+')').join(', ')+'</div>':'<div class="helperbox">Derzeit sind noch keine fachlich freigegebenen Förderdatensätze veröffentlicht.</div>')+'<div class="helperbox">Die Beispielhinweise sind keine amtlich geprüften Ansprüche. Der verifizierte Förderkatalog wird separat aus der Datenbank geladen.</div><button class="primary" id="restart">Erneut prüfen</button>';document.getElementById("restart").onclick=()=>{step=-1;answers=[];render()};return}
const q=questions[step];el.innerHTML='<div class="eyebrow">Frage '+(step+1)+' von '+questions.length+'</div><h1>'+esc(q.title)+'</h1><p>Wähle einfach die passende Antwort.</p><div id="options">'+q.options.map((o,i)=>'<button class="option '+(answers[step]===i?'selected':'')+'" data-i="'+i+'" aria-pressed="'+(answers[step]===i)+'">'+esc(o)+'</button>').join("")+'</div><div class="actions"><button class="secondary" id="back">← Zurück</button><button class="secondary" id="read">🔊 Vorlesen</button><button class="secondary" id="mic">🎙 Antworten</button></div><div class="helper"><button class="secondary" id="help">✨ Frage erklären</button>'+(helpOpen?'<div class="helperbox">'+esc(q.help)+'<p class="fine">Noch kein KI-Chat: Diese Erklärung ist ein sicherer Demo-Text.</p></div>':'')+'</div><button class="primary" id="next" '+(answers[step]===undefined?'disabled':'')+'>Weiter →</button>';
el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>select(Number(b.dataset.i)));document.getElementById("back").onclick=back;document.getElementById("read").onclick=()=>speak(q.title+". "+q.options.join(". "));document.getElementById("mic").onclick=listen;document.getElementById("help").onclick=()=>{helpOpen=!helpOpen;render()};document.getElementById("next").onclick=next}
render();
</script></body></html>
